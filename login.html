<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Owl House | Login</title>

    <meta name="description"
          content="Přihlášení na fanouškovskou stránku seriálu The Owl House.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Owl House</h1>

        <nav>
            <a href="index.html">Domů</a>
            <a href="galerie.html">Galerie</a>
            <a href="novinky.html">Novinky</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <section>
            <form>
                <div class="radek">
                <label for="Jmeno_Prijmeni">Jméno a Příjmení</label>
                <input type="text" id="Jmeno_Prijmeni" name="Jmeno_Prijmeni" required>
                </div>

                <div class="radek">
                <label for="Email">Email</label>
                <input type="email" id="Email" name="Email" required>
                </div>

                <div class="radek">
                <label for="Password">Heslo</label>
                <input type="password" id="Password" name="Password" required>
                </div>

                <div class="radek">
                <label for="Date_narozeni">Datum narození</label>
                <input type="date" id="Date_narozeni" name="Date_narozeni" required>
                </div>

                <button type="submit">Přihlásit se</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Vytvořeno v hodinách Úvodu do WWW</p>
    </footer>
</body>
</html>
